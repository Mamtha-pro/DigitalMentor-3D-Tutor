server:
  port: 8080

spring:
  application:
    name: mind-mentor-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/mind_mentor}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-before-deploying-to-production-01234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    generate-path: ${OLLAMA_GENERATE_PATH:/api/generate}
    model: ${OLLAMA_MODEL:smollm}
    timeout-ms: ${OLLAMA_TIMEOUT_MS:45000}

  web-search:
    provider: ${WEB_SEARCH_PROVIDER:duckduckgo}
    api-key: ${WEB_SEARCH_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.mindmentor.backend: DEBUG
