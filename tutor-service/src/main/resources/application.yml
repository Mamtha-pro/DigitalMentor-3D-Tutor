server:
  port: 8082

spring:
  application:
    name: tutor-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/mindmentor_tutor}

app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    generate-path: ${OLLAMA_GENERATE_PATH:/api/generate}
    model: ${OLLAMA_MODEL:smollm}
    timeout-ms: ${OLLAMA_TIMEOUT_MS:45000}

  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-before-deploying-to-production-01234567890}