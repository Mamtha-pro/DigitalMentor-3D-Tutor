server:
  port: 8081

spring:
  application:
    name: identity-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/mindmentor_identity}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-before-deploying-to-production-01234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}